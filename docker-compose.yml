services:
  # ============================================================
  # PostgreSQL with pgvector extension
  # pgvector image: https://hub.docker.com/r/pgvector/pgvector
  # ============================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: stocklens_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: stocklens
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Auto-run migrations on first start (alphabetical order)
      - ./supabase/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stocklens"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # Redis — price cache, AI cache, rate limiting
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: stocklens_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # pgAdmin — browser-based DB viewer (optional)
  # Access: http://localhost:5050
  # Login: admin@local.com / admin
  # ============================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: stocklens_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

  # ============================================================
  # FastAPI Backend (optional — run locally with start-dev.bat instead)
  # ============================================================
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: stocklens_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:password@postgres:5432/stocklens
      DATABASE_SYNC_URL: postgresql://postgres:password@postgres:5432/stocklens
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./apps/api:/app
      - ./apps/ml:/ml
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    profiles:
      - full  # only starts with: docker compose --profile full up

  # ============================================================
  # Upstox WebSocket Worker
  # ============================================================
  worker:
    build:
      context: ./apps/worker
      dockerfile: Dockerfile
    container_name: stocklens_worker
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+asyncpg://postgres:password@postgres:5432/stocklens
    volumes:
      - ./apps/worker:/app
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    profiles:
      - full  # only starts with: docker compose --profile full up

  # ============================================================
  # Next.js Frontend (optional — run locally with start-dev.bat instead)
  # ============================================================
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: stocklens_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8001
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/.next
    depends_on:
      - api
    command: npm run dev
    profiles:
      - full  # only starts with: docker compose --profile full up

# ── Named volumes (avoids Windows path permission issues) ─────────────────────
volumes:
  postgres_data:
  redis_data:
  pgadmin_data:
  web_node_modules:
  web_next:

networks:
  default:
    name: stocklens_network
